<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man — Canvas Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      --blue: #3155ff;
      --yellow: #ffe234;
      --ink: #050510;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px;
      background: radial-gradient(circle at 50% 15%, #171737 0, #070711 45%, #020205 100%);
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      user-select: none;
    }

    #game-shell {
      width: min(100%, 720px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: var(--yellow);
      font-size: clamp(24px, 5vw, 42px);
      letter-spacing: 0.16em;
      text-shadow: 0 0 18px #ffe23455;
    }

    #hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .hud-block {
      padding: 8px 4px;
      border: 1px solid #3155ff55;
      border-radius: 8px;
      background: #08081add;
    }

    .hud-label {
      display: block;
      margin-bottom: 4px;
      color: #9ca8d8;
      font-size: clamp(9px, 2vw, 12px);
      letter-spacing: 0.1em;
    }

    .hud-value { font-size: clamp(15px, 3.5vw, 23px); }
    #lives { color: var(--yellow); letter-spacing: 0.08em; }

    #board-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 2px solid #263dad;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 0 30px #1838c744;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }

    #help {
      margin: 12px 0 8px;
      color: #b9c0df;
      font: 13px/1.6 system-ui, sans-serif;
    }

    #touch-controls {
      display: none;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(2, 46px);
      justify-content: center;
      gap: 5px;
      margin-top: 10px;
    }

    #touch-controls button {
      border: 1px solid #6375ca;
      border-radius: 8px;
      background: #171a36;
      color: white;
      font-size: 23px;
      touch-action: manipulation;
    }

    #touch-controls button:active { background: #35428b; }
    #touch-up { grid-column: 2; }
    #touch-left { grid-column: 1; grid-row: 2; }
    #touch-down { grid-column: 2; grid-row: 2; }
    #touch-right { grid-column: 3; grid-row: 2; }

    @media (pointer: coarse), (max-width: 560px) {
      body { padding: 10px; }
      #touch-controls { display: grid; }
      #help { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main id="game-shell">
    <h1>PAC-MAN</h1>
    <section id="hud" aria-label="Game status">
      <div class="hud-block"><span class="hud-label">SCORE</span><span class="hud-value" id="score">0</span></div>
      <div class="hud-block"><span class="hud-label">HIGH SCORE</span><span class="hud-value" id="high-score">0</span></div>
      <div class="hud-block"><span class="hud-label">LIVES</span><span class="hud-value" id="lives">● ● ●</span></div>
    </section>
    <div id="board-wrap">
      <canvas id="game" width="672" height="744" aria-label="Pac-Man game board"></canvas>
    </div>
    <div id="touch-controls" aria-label="Touch direction controls">
      <button id="touch-up" data-dir="up" aria-label="Move up">▲</button>
      <button id="touch-left" data-dir="left" aria-label="Move left">◀</button>
      <button id="touch-down" data-dir="down" aria-label="Move down">▼</button>
      <button id="touch-right" data-dir="right" aria-label="Move right">▶</button>
    </div>
    <p id="help">Move: Arrow keys / WASD · Pause: P / Esc · Mute: M<br>Enter / Space or tap the board to start</p>
  </main>

  <script>
    "use strict";

    // Required build marker: undefined

    // -------------------------------------------------------------------------
    // Maze data and shared constants. The grid is the single source of truth:
    // # = wall, . = dot, o = power pellet, - = ghost gate, space = open path.
    // -------------------------------------------------------------------------
    const TILE = 24;
    const COLS = 28;
    const ROWS = 31;
    const WIDTH = COLS * TILE;
    const HEIGHT = ROWS * TILE;
    const STEP = 1 / 120;
    const DIRS = {
      none:  { x: 0, y: 0, angle: 0 },
      left:  { x: -1, y: 0, angle: Math.PI },
      right: { x: 1, y: 0, angle: 0 },
      up:    { x: 0, y: -1, angle: -Math.PI / 2 },
      down:  { x: 0, y: 1, angle: Math.PI / 2 }
    };
    const DIR_LIST = [DIRS.up, DIRS.left, DIRS.down, DIRS.right];

    const MAZE = [
      "############################",
      "#............##............#",
      "#.####.#####.##.#####.####.#",
      "#o####.#####.##.#####.####o#",
      "#.####.#####.##.#####.####.#",
      "#..........................#",
      "#.####.##.########.##.####.#",
      "#.####.##.########.##.####.#",
      "#......##....##....##......#",
      "######.##### ## #####.######",
      "######.##### ## #####.######",
      "######.##          ##.######",
      "######.## ###--### ##.######",
      "######.## #      # ##.######",
      "      .   #      #   .      ",
      "######.## #      # ##.######",
      "######.## ######## ##.######",
      "######.##          ##.######",
      "######.## ######## ##.######",
      "######.## ######## ##.######",
      "#............##............#",
      "#.####.#####.##.#####.####.#",
      "#.####.#####.##.#####.####.#",
      "#o..##................##..o#",
      "###.##.##.########.##.##.###",
      "###.##.##.########.##.##.###",
      "#......##....##....##......#",
      "#.##########.##.##########.#",
      "#.##########.##.##########.#",
      "#..........................#",
      "############################"
    ];

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("high-score");
    const livesEl = document.getElementById("lives");

    let grid = [];
    let pelletsRemaining = 0;
    let player;
    let ghosts = [];
    let score = 0;
    let highScore = loadHighScore();
    let lives = 3;
    let level = 1;
    let state = "title";
    let paused = false;
    let readyTimer = 0;
    let deathTimer = 0;
    let levelTimer = 0;
    let levelElapsed = 0;
    let frightTimer = 0;
    let ghostCombo = 0;
    let globalTime = 0;
    let wakaHigh = false;
    let popups = [];
    let modeIndex = 0;
    let modeTimer = 7;
    let muted = false;
    const MODE_SCHEDULE = [7, 20, 7, 20, 5, 20, 5, Infinity];

    function loadHighScore() {
      try { return Number(localStorage.getItem("pacmanHermesHighScore")) || 0; }
      catch (_) { return 0; }
    }

    function saveHighScore() {
      try { localStorage.setItem("pacmanHermesHighScore", String(highScore)); }
      catch (_) { /* Storage can be unavailable for local files; play continues. */ }
    }

    function buildGrid() {
      grid = MAZE.map(row => row.split(""));
      pelletsRemaining = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (r === 23 && (c === 13 || c === 14)) grid[r][c] = " ";
          if (grid[r][c] === "." || grid[r][c] === "o") pelletsRemaining++;
        }
      }
    }

    function tileAt(c, r) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return "#";
      return grid[r][c];
    }

    function opposite(dir) {
      if (dir === DIRS.left) return DIRS.right;
      if (dir === DIRS.right) return DIRS.left;
      if (dir === DIRS.up) return DIRS.down;
      if (dir === DIRS.down) return DIRS.up;
      return DIRS.none;
    }

    function sameDir(a, b) { return a.x === b.x && a.y === b.y; }

    // -------------------------------------------------------------------------
    // Tiny Web Audio synthesizer: no sound files or external assets are needed.
    // -------------------------------------------------------------------------
    let audioContext = null;

    function ensureAudio() {
      if (!audioContext) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (AudioCtor) audioContext = new AudioCtor();
      }
      if (audioContext && audioContext.state === "suspended") audioContext.resume();
    }

    function tone(frequency, duration, type = "square", volume = 0.035, delay = 0, endFrequency = frequency) {
      if (muted || !audioContext) return;
      const now = audioContext.currentTime + delay;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(Math.max(20, frequency), now);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), now + duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.02);
    }

    function sound(name) {
      if (name === "dot") {
        wakaHigh = !wakaHigh;
        tone(wakaHigh ? 520 : 390, 0.045, "square", 0.025, 0, wakaHigh ? 390 : 520);
      } else if (name === "power") {
        tone(160, 0.35, "sawtooth", 0.045, 0, 640);
      } else if (name === "ghost") {
        tone(240, 0.25, "square", 0.05, 0, 960);
        tone(480, 0.18, "triangle", 0.035, 0.12, 1200);
      } else if (name === "death") {
        tone(620, 0.8, "sawtooth", 0.05, 0, 70);
        tone(310, 0.65, "square", 0.025, 0.12, 45);
      } else if (name === "start") {
        [262, 330, 392, 523].forEach((note, i) => tone(note, 0.12, "square", 0.035, i * 0.11));
      } else if (name === "level") {
        [392, 523, 659, 784].forEach((note, i) => tone(note, 0.16, "triangle", 0.04, i * 0.1));
      }
    }

    // -------------------------------------------------------------------------
    // Game flow and actor setup. A death keeps collected dots removed; a new
    // level rebuilds every collectible and makes ghosts faster for less time.
    // -------------------------------------------------------------------------
    function updateHUD() {
      scoreEl.textContent = String(score).padStart(2, "0");
      highScoreEl.textContent = String(highScore).padStart(2, "0");
      livesEl.textContent = lives > 0 ? Array(lives).fill("●").join(" ") : "—";
    }

    function addScore(points) {
      score += points;
      if (score > highScore) {
        highScore = score;
        saveHighScore();
      }
      updateHUD();
    }

    function resetActors() {
      player = {
        x: 13.5, y: 23.5, dir: DIRS.left, nextDir: DIRS.left,
        mouth: 0, moving: false
      };
      ghosts = [
        { name: "Blinky", color: "#ff334f", x: 13.5, y: 11.5, homeX: 13.5, homeY: 14.5,
          dir: DIRS.left, state: "active", releaseAt: 0, scatter: { x: 25, y: 0 } },
        { name: "Pinky", color: "#ff9dde", x: 13.5, y: 14.5, homeX: 13.5, homeY: 14.5,
          dir: DIRS.up, state: "house", releaseAt: levelElapsed + 1.5, scatter: { x: 2, y: 0 } },
        { name: "Inky", color: "#27e6ed", x: 11.5, y: 14.5, homeX: 11.5, homeY: 14.5,
          dir: DIRS.up, state: "house", releaseAt: levelElapsed + 4.5, scatter: { x: 27, y: 30 } },
        { name: "Clyde", color: "#ffad42", x: 15.5, y: 14.5, homeX: 15.5, homeY: 14.5,
          dir: DIRS.up, state: "house", releaseAt: levelElapsed + 8, scatter: { x: 0, y: 30 } }
      ];
      frightTimer = 0;
      ghostCombo = 0;
      modeIndex = 0;
      modeTimer = MODE_SCHEDULE[0];
      readyTimer = 2;
      popups = [];
    }

    function newGame() {
      score = 0;
      lives = 3;
      level = 1;
      levelElapsed = 0;
      buildGrid();
      resetActors();
      state = "playing";
      paused = false;
      updateHUD();
      ensureAudio();
      sound("start");
    }

    function nextLevel() {
      level++;
      levelElapsed = 0;
      buildGrid();
      resetActors();
      state = "playing";
      paused = false;
      sound("start");
    }

    function finishLevel() {
      state = "levelComplete";
      levelTimer = 3;
      frightTimer = 0;
      addScore(1000);
      sound("level");
    }

    function killPlayer() {
      if (state !== "playing") return;
      state = "dying";
      deathTimer = 1.8;
      lives--;
      updateHUD();
      sound("death");
    }

    function togglePause() {
      if (state !== "playing") return;
      paused = !paused;
    }

    // -------------------------------------------------------------------------
    // Smooth grid movement. Actors move continuously, but turns are committed
    // at tile centers. Reversals are immediate, which keeps controls responsive.
    // -------------------------------------------------------------------------
    function isWalkable(c, r, actor) {
      if (r === 14 && (c < 0 || c >= COLS)) return true; // horizontal tunnel
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      const tile = grid[r][c];
      if (tile === "#") return false;
      if (tile === "-") {
        return actor !== player && (actor.state === "eaten" || actor.state === "leaving" || actor.state === "returning");
      }
      return true;
    }

    function wrapTunnel(actor) {
      if (actor.y > 13.9 && actor.y < 15.1) {
        if (actor.x < -0.5) actor.x = COLS + 0.5;
        else if (actor.x > COLS + 0.5) actor.x = -0.5;
      }
    }

    function moveOnGrid(actor, speed, dt, chooseDirection) {
      const distance = speed * dt;
      const c = Math.floor(actor.x);
      const r = Math.floor(actor.y);
      const cx = c + 0.5;
      const cy = r + 0.5;
      const nearCenter = Math.abs(actor.x - cx) <= distance + 0.0001 &&
                         Math.abs(actor.y - cy) <= distance + 0.0001;
      const approaching = sameDir(actor.dir, DIRS.none) ||
        ((cx - actor.x) * actor.dir.x + (cy - actor.y) * actor.dir.y) >= -0.0001;

      if (nearCenter && approaching) {
        actor.x = cx;
        actor.y = cy;
        chooseDirection(actor, c, r);
      }

      actor.x += actor.dir.x * distance;
      actor.y += actor.dir.y * distance;
      wrapTunnel(actor);
    }

    function updatePlayer(dt) {
      const speed = Math.min(9, 7.4 + (level - 1) * 0.18);
      player.moving = false;
      moveOnGrid(player, speed, dt, (actor, c, r) => {
        if (isWalkable(c + actor.nextDir.x, r + actor.nextDir.y, actor)) {
          actor.dir = actor.nextDir;
        }
        if (!isWalkable(c + actor.dir.x, r + actor.dir.y, actor)) actor.dir = DIRS.none;
      });
      player.moving = !sameDir(player.dir, DIRS.none);
      if (player.moving) player.mouth += dt * 15;
      collectAtPlayer();
    }

    function setPlayerDirection(dir) {
      if (!player) return;
      player.nextDir = dir;
      if (state === "playing" && sameDir(opposite(player.dir), dir)) player.dir = dir;
    }

    function collectAtPlayer() {
      const c = Math.floor(player.x);
      const r = Math.floor(player.y);
      if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
      if (Math.abs(player.x - (c + 0.5)) > 0.32 || Math.abs(player.y - (r + 0.5)) > 0.32) return;
      const tile = grid[r][c];
      if (tile !== "." && tile !== "o") return;

      grid[r][c] = " ";
      pelletsRemaining--;
      if (tile === ".") {
        addScore(10);
        sound("dot");
      } else {
        addScore(50);
        frightTimer = Math.max(2.2, 7 - (level - 1) * 0.55);
        ghostCombo = 0;
        for (const ghost of ghosts) {
          if (ghost.state === "active") ghost.dir = opposite(ghost.dir);
        }
        sound("power");
      }
      if (pelletsRemaining === 0) finishLevel();
    }

    // -------------------------------------------------------------------------
    // Ghost AI. Scatter/chase waves alternate globally, while each ghost picks
    // a different target. Frightened ghosts choose randomly at intersections.
    // -------------------------------------------------------------------------
    function ghostTarget(ghost) {
      if (ghost.state === "eaten") return { x: 13, y: 11 };
      const scatterMode = modeIndex % 2 === 0;
      if (scatterMode) return ghost.scatter;

      const px = Math.floor(player.x);
      const py = Math.floor(player.y);
      if (ghost.name === "Blinky") return { x: px, y: py };
      if (ghost.name === "Pinky") {
        return { x: px + player.dir.x * 4, y: py + player.dir.y * 4 };
      }
      if (ghost.name === "Inky") {
        const aheadX = px + player.dir.x * 2;
        const aheadY = py + player.dir.y * 2;
        const red = ghosts[0];
        return { x: aheadX * 2 - Math.floor(red.x), y: aheadY * 2 - Math.floor(red.y) };
      }
      // Clyde is shy near Pac-Man and occasionally makes a random turn.
      const dx = ghost.x - player.x;
      const dy = ghost.y - player.y;
      return dx * dx + dy * dy > 64 ? { x: px, y: py } : ghost.scatter;
    }

    function chooseGhostDirection(ghost, c, r) {
      let options = DIR_LIST.filter(dir =>
        !sameDir(dir, opposite(ghost.dir)) && isWalkable(c + dir.x, r + dir.y, ghost)
      );
      if (options.length === 0) options = DIR_LIST.filter(dir => isWalkable(c + dir.x, r + dir.y, ghost));
      if (options.length === 0) {
        ghost.dir = DIRS.none;
        return;
      }

      const frightened = ghost.state === "active" && frightTimer > 0;
      if (frightened || (ghost.name === "Clyde" && Math.random() < 0.12)) {
        ghost.dir = options[Math.floor(Math.random() * options.length)];
        return;
      }

      const target = ghostTarget(ghost);
      let best = options[0];
      let bestDistance = Infinity;
      for (const dir of options) {
        const dx = c + dir.x - target.x;
        const dy = r + dir.y - target.y;
        const distance = dx * dx + dy * dy;
        if (distance < bestDistance) {
          bestDistance = distance;
          best = dir;
        }
      }
      ghost.dir = best;
    }

    // House movement follows a short scripted path through the gate. Eaten
    // ghosts use the same path in reverse, then wait briefly before exiting.
    function moveHousePath(ghost, exiting, dt) {
      const speed = exiting ? 3.8 : 8;
      const distance = speed * dt;
      const moveX = target => {
        const dx = target - ghost.x;
        ghost.dir = dx < 0 ? DIRS.left : DIRS.right;
        ghost.x += Math.sign(dx) * Math.min(Math.abs(dx), distance);
      };
      const moveY = target => {
        const dy = target - ghost.y;
        ghost.dir = dy < 0 ? DIRS.up : DIRS.down;
        ghost.y += Math.sign(dy) * Math.min(Math.abs(dy), distance);
      };

      if (exiting) {
        if (Math.abs(ghost.x - 13.5) > 0.001) moveX(13.5);
        else {
          ghost.x = 13.5;
          moveY(11.5);
        }
        if (ghost.y <= 11.5001 && Math.abs(ghost.x - 13.5) < 0.001) {
          ghost.y = 11.5;
          ghost.state = "active";
          ghost.dir = Math.random() < 0.5 ? DIRS.left : DIRS.right;
        }
      } else {
        if (ghost.y < 13.499) {
          if (Math.abs(ghost.x - 13.5) > 0.001) moveX(13.5);
          else { ghost.x = 13.5; moveY(13.5); }
        } else if (Math.abs(ghost.x - ghost.homeX) > 0.001) {
          ghost.y = 13.5;
          moveX(ghost.homeX);
        } else if (ghost.y < ghost.homeY - 0.001) {
          ghost.x = ghost.homeX;
          moveY(ghost.homeY);
        } else {
          ghost.x = ghost.homeX;
          ghost.y = ghost.homeY;
          ghost.state = "house";
          ghost.dir = DIRS.up;
          ghost.releaseAt = levelElapsed + 1.4;
        }
      }
    }

    function updateGhost(ghost, dt) {
      if (ghost.state === "house") {
        if (levelElapsed >= ghost.releaseAt) ghost.state = "leaving";
        return;
      }
      if (ghost.state === "leaving") {
        moveHousePath(ghost, true, dt);
        return;
      }
      if (ghost.state === "returning") {
        moveHousePath(ghost, false, dt);
        return;
      }
      if (ghost.state === "eaten" && Math.hypot(ghost.x - 13.5, ghost.y - 11.5) < 0.2) {
        ghost.state = "returning";
        ghost.x = 13.5;
        ghost.y = 11.5;
        return;
      }

      let speed = ghost.state === "eaten" ? 12 : Math.min(8.5, 6.2 + (level - 1) * 0.28);
      if (ghost.state === "active" && frightTimer > 0) speed = 4.4;
      if (ghost.y > 13.9 && ghost.y < 15.1 && (ghost.x < 6 || ghost.x > 22)) speed *= 0.6;
      if (ghost.name === "Blinky" && ghost.state === "active" && pelletsRemaining < 30) speed += 0.45;
      moveOnGrid(ghost, speed, dt, chooseGhostDirection);
    }

    function updateGhostMode(dt) {
      if (!Number.isFinite(modeTimer)) return;
      modeTimer -= dt;
      if (modeTimer <= 0) {
        modeIndex = Math.min(modeIndex + 1, MODE_SCHEDULE.length - 1);
        modeTimer = MODE_SCHEDULE[modeIndex];
        for (const ghost of ghosts) {
          if (ghost.state === "active") ghost.dir = opposite(ghost.dir);
        }
      }
    }

    // -------------------------------------------------------------------------
    // Collisions and fixed-step game update. Only active ghosts can hurt or be
    // eaten; house ghosts and returning eyes are deliberately non-colliding.
    // -------------------------------------------------------------------------
    function checkCollisions() {
      for (const ghost of ghosts) {
        if (ghost.state !== "active") continue;
        const dx = ghost.x - player.x;
        const dy = ghost.y - player.y;
        if (dx * dx + dy * dy > 0.48) continue;

        if (frightTimer > 0) {
          const points = 200 * Math.pow(2, Math.min(ghostCombo, 3));
          ghostCombo++;
          addScore(points);
          popups.push({ x: ghost.x, y: ghost.y, text: String(points), life: 1 });
          ghost.state = "eaten";
          ghost.dir = opposite(ghost.dir);
          sound("ghost");
        } else {
          killPlayer();
          return;
        }
      }
    }

    function update(dt) {
      if (paused) return;
      globalTime += dt;
      for (const popup of popups) {
        popup.life -= dt;
        popup.y -= dt * 0.45;
      }
      popups = popups.filter(popup => popup.life > 0);

      if (state === "levelComplete") {
        levelTimer -= dt;
        if (levelTimer <= 0) nextLevel();
        return;
      }

      if (state === "dying") {
        deathTimer -= dt;
        if (deathTimer <= 0) {
          if (lives <= 0) state = "gameover";
          else {
            resetActors();
            state = "playing";
          }
        }
        return;
      }

      if (state !== "playing") return;
      if (readyTimer > 0) {
        readyTimer -= dt;
        return;
      }

      levelElapsed += dt;
      updatePlayer(dt);
      if (state !== "playing") return;
      updateGhostMode(dt);
      if (frightTimer > 0) frightTimer = Math.max(0, frightTimer - dt);
      for (const ghost of ghosts) {
        updateGhost(ghost, dt);
        if (state !== "playing") return;
      }
      checkCollisions();
    }

    // -------------------------------------------------------------------------
    // Canvas rendering: outlined wall tiles, animated pellets and characters,
    // directional ghost eyes, score popups, and all game-flow overlays.
    // -------------------------------------------------------------------------
    function isWall(c, r) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
      return grid[r][c] === "#";
    }

    function drawMaze() {
      ctx.fillStyle = "#000008";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = "#080f32";
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === "#") ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        }
      }

      ctx.strokeStyle = "#3155ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] !== "#") continue;
          const x = c * TILE;
          const y = r * TILE;
          if (!isWall(c, r - 1)) { ctx.moveTo(x, y + 1); ctx.lineTo(x + TILE, y + 1); }
          if (!isWall(c, r + 1)) { ctx.moveTo(x, y + TILE - 1); ctx.lineTo(x + TILE, y + TILE - 1); }
          if (!isWall(c - 1, r)) { ctx.moveTo(x + 1, y); ctx.lineTo(x + 1, y + TILE); }
          if (!isWall(c + 1, r)) { ctx.moveTo(x + TILE - 1, y); ctx.lineTo(x + TILE - 1, y + TILE); }
        }
      }
      ctx.stroke();

      ctx.strokeStyle = "#ff9dde";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(13 * TILE + 2, 12.5 * TILE);
      ctx.lineTo(15 * TILE - 2, 12.5 * TILE);
      ctx.stroke();

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const tile = grid[r][c];
          if (tile !== "." && tile !== "o") continue;
          const x = (c + 0.5) * TILE;
          const y = (r + 0.5) * TILE;
          ctx.fillStyle = tile === "o" ? "#fff2bd" : "#f4eee0";
          ctx.beginPath();
          const radius = tile === "o" ? 5.5 + Math.sin(globalTime * 7) * 1.4 : 2.1;
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawPlayer() {
      if (state === "gameover") return;
      const deathProgress = state === "dying" ? 1 - deathTimer / 1.8 : 0;
      if (deathProgress > 0.92) return;
      let mouth = player.moving ? 0.08 + Math.abs(Math.sin(player.mouth)) * 0.24 * Math.PI : 0.1 * Math.PI;
      if (state === "dying") mouth = Math.min(Math.PI * 0.98, 0.15 + deathProgress * Math.PI * 1.12);
      const x = player.x * TILE;
      const y = player.y * TILE;
      const radius = TILE * 0.43 * (state === "dying" ? 1 - deathProgress * 0.35 : 1);
      const angle = player.dir.angle;

      ctx.save();
      ctx.shadowColor = "#ffe23488";
      ctx.shadowBlur = 8;
      ctx.fillStyle = "#ffe234";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, radius, angle + mouth, angle + Math.PI * 2 - mouth);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawGhost(ghost) {
      const bob = ghost.state === "house" ? Math.sin(globalTime * 5 + ghost.homeX) * 0.1 : 0;
      const x = ghost.x * TILE;
      const y = (ghost.y + bob) * TILE;
      const r = TILE * 0.41;
      const eyesOnly = ghost.state === "eaten" || ghost.state === "returning";
      const frightened = ghost.state === "active" && frightTimer > 0;
      const flashing = frightened && frightTimer < 2 && Math.floor(globalTime * 8) % 2 === 0;

      if (!eyesOnly) {
        ctx.fillStyle = frightened ? (flashing ? "#f4f4ff" : "#2737e8") : ghost.color;
        ctx.beginPath();
        ctx.moveTo(x - r, y + r * 0.8);
        ctx.lineTo(x - r, y);
        ctx.arc(x, y, r, Math.PI, 0);
        ctx.lineTo(x + r, y + r * 0.8);
        for (let i = 0; i < 6; i++) {
          const px = x + r - (i + 1) * (2 * r / 6);
          const py = y + r * (i % 2 === 0 ? 0.48 : 0.8);
          ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      if (frightened && !flashing) {
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(x - 4, y - 3, 1.8, 0, Math.PI * 2);
        ctx.arc(x + 4, y - 3, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - 6, y + 5);
        for (let i = 0; i < 4; i++) ctx.lineTo(x - 4.5 + i * 3, y + (i % 2 ? 5 : 2));
        ctx.stroke();
      } else {
        const dir = sameDir(ghost.dir, DIRS.none) ? DIRS.up : ghost.dir;
        for (const side of [-1, 1]) {
          const ex = x + side * 4.2;
          const ey = y - 3;
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.ellipse(ex, ey, 3.3, 4.3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#2137a8";
          ctx.beginPath();
          ctx.arc(ex + dir.x * 1.5, ey + dir.y * 1.7, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawPopups() {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 15px Courier New";
      for (const popup of popups) {
        ctx.globalAlpha = Math.min(1, popup.life * 2);
        ctx.fillStyle = "#62f4ff";
        ctx.fillText(popup.text, popup.x * TILE, popup.y * TILE);
      }
      ctx.globalAlpha = 1;
    }

    function drawOverlay(title, lines, color = "#ffe234") {
      ctx.fillStyle = "rgba(0, 0, 10, 0.84)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      ctx.font = "bold 48px Courier New";
      ctx.fillText(title, WIDTH / 2, HEIGHT / 2 - 70);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px Courier New";
      lines.forEach((line, index) => ctx.fillText(line, WIDTH / 2, HEIGHT / 2 + index * 34));
    }

    function render() {
      drawMaze();
      if (state !== "dying") {
        for (const ghost of ghosts) drawGhost(ghost);
      }
      drawPlayer();
      drawPopups();

      if (state === "playing" && readyTimer > 0 && !paused) {
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffe234";
        ctx.font = "bold 22px Courier New";
        ctx.fillText("READY!", WIDTH / 2, 20.2 * TILE);
      }
      if (state === "title") {
        drawOverlay("PAC-MAN", ["A CANVAS ARCADE TRIBUTE", "ENTER / SPACE / TAP TO START"]);
      } else if (state === "gameover") {
        drawOverlay("GAME OVER", ["FINAL SCORE  " + score, "HIGH SCORE  " + highScore, "ENTER / SPACE / TAP TO RESTART"], "#ff526b");
      } else if (state === "levelComplete") {
        drawOverlay("LEVEL CLEAR!", ["1000 POINT BONUS", "GET READY FOR LEVEL " + (level + 1)], "#62f4ff");
      } else if (paused) {
        drawOverlay("PAUSED", ["PRESS P OR ESC TO CONTINUE", "M TO TOGGLE SOUND"], "#fff");
      }
    }

    // -------------------------------------------------------------------------
    // Keyboard, touch, pause, and the fixed-timestep animation loop.
    // -------------------------------------------------------------------------
    const KEY_DIRS = {
      ArrowLeft: DIRS.left, KeyA: DIRS.left,
      ArrowRight: DIRS.right, KeyD: DIRS.right,
      ArrowUp: DIRS.up, KeyW: DIRS.up,
      ArrowDown: DIRS.down, KeyS: DIRS.down
    };

    window.addEventListener("keydown", event => {
      const dir = KEY_DIRS[event.code];
      if (dir) {
        event.preventDefault();
        ensureAudio();
        setPlayerDirection(dir);
        return;
      }
      if (event.code === "Enter" || event.code === "Space") {
        event.preventDefault();
        if (state === "title" || state === "gameover") newGame();
        else if (state === "levelComplete") nextLevel();
      } else if ((event.code === "KeyP" || event.code === "Escape") && !event.repeat) {
        event.preventDefault();
        togglePause();
      } else if (event.code === "KeyM" && !event.repeat) {
        muted = !muted;
        if (!muted) ensureAudio();
      }
    });

    canvas.addEventListener("pointerdown", () => {
      ensureAudio();
      if (state === "title" || state === "gameover") newGame();
      else if (state === "levelComplete") nextLevel();
    });

    document.querySelectorAll("#touch-controls button").forEach(button => {
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        ensureAudio();
        setPlayerDirection(DIRS[button.dataset.dir]);
      });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state === "playing") paused = true;
    });

    let previousTime = performance.now();
    let accumulator = 0;
    function frame(now) {
      const elapsed = Math.min(0.05, (now - previousTime) / 1000);
      previousTime = now;
      if (paused) accumulator = 0;
      else accumulator += elapsed;
      while (accumulator >= STEP) {
        update(STEP);
        accumulator -= STEP;
      }
      render();
      requestAnimationFrame(frame);
    }

    buildGrid();
    resetActors();
    readyTimer = 0;
    updateHUD();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
